# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/resource.schema.json
apiVersion: workspec.io/v1alpha1
kind: Resource
metadata:
  slug: app-service
spec:
  name: 'Web App Service'
  kind: compute
  type: 'Azure App Service'
  provider: azure
  network: snet-workload
  resourceGroup: rg-app
  realizes: [api-server]
  config:
    tier: P1v3
  cost:
    sku: p1v3
    mode: payg
    schedule: always
    qty: 2
    attribution:
      - container: api-server
        share: 1
  source:
    kind: authored
