# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/resource.schema.json
apiVersion: workspec.io/v1alpha1
kind: Resource
metadata:
  slug: app-service
spec:
  name: 'Web App Service'
  kind: compute
  type: 'Azure App Service'
  provider: azure
  network: snet-workload
  resourceGroup: rg-app
  realizes: [api-server]
  config:
    tier: P1v3
  cost:
    sku: p1v3
    mode: payg
    schedule: always
    qty: 2
    attribution:
      - container: api-server
        share: 1
  source:
    kind: authored
  overrides:
    # instances: 1 in dev/test (base qty is 2, so both still need an
    # explicit override); prod re-tiers to p2v3 x3.
    dev:
      cost:
        qty: 1
    test:
      cost:
        qty: 1
    prod:
      cost:
        sku: p2v3
        qty: 3
