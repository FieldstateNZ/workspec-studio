# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/scenario.schema.json
apiVersion: workspec.io/v1alpha1
kind: Scenario
metadata:
  slug: inline-create-each-kind
spec:
  title: Inline create works for each element kind
  systemRequirement: inline-create
  given:
    - a canvas
  when:
    - the dev lead inline-creates a "<kind>"
  then:
    - a valid "<kind>" artifact is written
  examples:
    - { kind: component }
    - { kind: container }
    - { kind: database }
