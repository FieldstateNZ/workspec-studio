# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: hosting-platform
spec:
  title: 'Hosting platform for the data and delivery services'
  status: exploring
  created: '2026-07-01'
  deciders:
    - 'Platform Engineering'
  supersedes: legacy-hosting
  context: >-
    The data-management and delivery services need a consolidated hosting
    platform, costed across dev / test / prod and weighed on ops burden and
    scale ceiling.
  catalog: platform
  currency: NZD
  environments:
    - dev
    - test
    - prod
  criteria:
    - id: opsBurden
      label: 'Ops burden'
      hint: 'Day-2 operational load (higher = lighter)'
      weight: 0.5
    - id: scaleCeiling
      label: 'Scale ceiling'
      hint: 'How far it scales before re-platforming'
      weight: 2
  options:
    # ── AKS ─────────────────────────────────────────────────────────────────
    - id: aks
      name: 'AKS'
      archetype: 'Azure Kubernetes Service'
      tag: 'current direction'
      environments: [dev, test, prod]
      complete: true
      lines:
        - id: sys
          group: compute
          label: 'System node pool'
          flat: false
          sku: d4s_v5
          mode: payg
          schedule: always
          tag: nonprod-compute
          qty: { dev: 1, test: 1, prod: 2 }
        - id: work
          group: compute
          label: 'Workload pool'
          flat: false
          sku: d8s_v5
          mode: payg
          schedule: always
          tag: steady-prod
          qty: { dev: 1, test: 1, prod: 4 }
        - id: batch
          group: compute
          label: 'Batch pool (overnight ETL)'
          flat: false
          sku: d4s_v5
          mode: payg
          schedule: overnight
          tag: batch
          qty: { dev: 0, test: 0, prod: 2 }
        - id: pg
          group: data
          label: 'Postgres Flexible Server'
          flat: true
          tag: db
          amount: { dev: 90, test: 90, prod: 220 }
          estimate: false
      levers:
        - id: reserveProd
          label: 'Reserve steady-prod capacity'
          hint: '3yr reserved pricing for the workload pool'
          enabled: false
          patch:
            - match: { tags: ['steady-prod'] }
              set: { mode: ri3 }
        - id: scheduleNonProd
          label: 'Schedule non-prod off nights/weekends'
          enabled: true
          patch:
            - match: { tags: ['nonprod-compute'] }
              set: { schedule: business }
        - id: spotBatch
          label: 'Use spot capacity for batch'
          enabled: true
          patch:
            - match: { tags: ['batch'] }
              set: { mode: spot }
      scores:
        opsBurden: { score: 3 }
        scaleCeiling: { score: 4 }
    # ── App Service ─────────────────────────────────────────────────────────
    - id: appsvc
      name: 'App Service'
      archetype: 'Azure App Service'
      environments: [dev, test, prod]
      complete: true
      lines:
        - id: plan
          group: compute
          label: 'App Service plan'
          flat: false
          sku: p2v3
          mode: payg
          schedule: always
          tag: steady-prod
          qty: { dev: 1, test: 1, prod: 2 }
        - id: pg
          group: data
          label: 'Postgres Flexible Server'
          flat: true
          tag: db
          amount: { dev: 90, test: 90, prod: 220 }
          estimate: false
      levers:
        - id: reserveProd
          label: 'Reserve steady-prod capacity'
          enabled: false
          patch:
            - match: { tags: ['steady-prod'] }
              set: { mode: ri3 }
        - id: scheduleNonProd
          label: 'Schedule non-prod off nights/weekends'
          enabled: true
          patch:
            - match: { tags: ['nonprod-compute'] }
              set: { schedule: business }
      scores:
        opsBurden: { score: 4 }
        scaleCeiling: { score: 2 }
    # ── Container Apps (still being modelled) ───────────────────────────────
    - id: aca
      name: 'Container Apps'
      archetype: 'Azure Container Apps'
      environments: [dev, test, prod]
      complete: false
      lines:
        - id: consumption
          group: compute
          label: 'Consumption plan'
          flat: false
          sku: ca_consumption
          mode: payg
          schedule: always
          qty: { dev: 1, test: 1, prod: 1 }
      scores:
        opsBurden: { score: 4 }
        scaleCeiling: { score: 3 }
