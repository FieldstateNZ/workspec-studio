# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: hosting-platform
spec:
  title: Hosting platform for the data and delivery services
  status: proposed
  created: 2026-07-01
  deciders:
    - Platform Engineering
  context: The data-management and delivery services need a consolidated hosting platform, costed
    across dev / test / prod and weighed on ops burden and scale ceiling.
  decision: Adopt AKS as the leading proposal, pending acceptance.
  rationale: AKS currently offers the strongest platform fit; this remains proposed until the
    remaining operational evidence is accepted.
  alternatives:
    - title: App Service
    - title: Container Apps
  supersedes: legacy-hosting
