# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: hosting-platform
spec:
  title: Hosting platform for the data and delivery services
  status: proposed
  created: 2026-07-01
  deciders:
    - Platform Engineering
  context: The data-management and delivery services need a consolidated hosting platform. The
    delivery service runs on App Service today; the data warehouse and batch jobs are outgrowing it.
    We need a like-for-like comparison of where these workloads should run — costed across dev /
    test / prod and weighed on ops, scale, isolation and lock-in.
  decision: Adopt AKS as the leading proposal, pending acceptance.
  rationale: AKS currently offers the strongest platform fit; this remains proposed until the
    remaining operational evidence is accepted.
  consequences:
    - One cluster, multi-tenant node pools. Non-prod scheduled off; Spot for batch; steady prod
      reservable.
  alternatives:
    - title: App Service
      reason: Status quo for the delivery service. PaaS plans per app, simple ops. Weaker density and
        scale story at platform size.
    - title: Isolated App Service (ASE)
      reason: Single-tenant isolation and compliance posture. Higher fixed floor from the ASE stamp fee.
    - title: Azure Container Apps
      reason: Serverless containers with scale-to-zero for spiky and preview workloads. Less control than
        AKS.
  references:
    - kind: deployment
      target: deploy/hosting-platform
      label: deploy/hosting-platform
    - kind: feature
      target: FEAT-204 Unified warehouse
      label: FEAT-204 Unified warehouse
    - kind: feature
      target: FEAT-218 Batch ETL
      label: FEAT-218 Batch ETL
    - kind: system-requirement
      target: SYSREQ-31 Multi-env parity
      label: SYSREQ-31 Multi-env parity
    - kind: system-requirement
      target: SYSREQ-44 Data residency (NZ)
      label: SYSREQ-44 Data residency (NZ)
