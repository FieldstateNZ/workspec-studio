# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/resource.schema.json
apiVersion: workspec.io/v1alpha1
kind: Resource
metadata:
  slug: cache-01
spec:
  name: 'Distributed Cache'
  kind: cache
  type: 'Azure Cache for Redis'
  provider: azure
  config:
    sku: Basic
    tier: C1
    zoneRedundant: false
  cost:
    sku: basic-c1
    mode: payg
    schedule: always
    qty: 1
  source:
    kind: derived
    from: 'Microsoft.Cache/redis:cache-01'
