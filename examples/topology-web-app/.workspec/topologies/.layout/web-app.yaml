# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/topology-layout.schema.json
#
# Per-lens pinned node positions for the `web-app` topology, adapted from the
# design prototype's `POS`/`POS_RG` layout tables (see this example's
# README.md for the source). Every resource gets a `network` position; the
# three resource-group container resources (rg-app/rg-network/rg-data) and
# the resources they group get an `rg` position too, laid out as three
# side-by-side columns.
version: 1
