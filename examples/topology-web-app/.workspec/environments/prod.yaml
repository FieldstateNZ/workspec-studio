# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/environment.schema.json
apiVersion: workspec.io/v1alpha1
kind: Environment
metadata:
  slug: prod
spec:
  naming:
    resourceGroupSuffix: '-prod'
  overrides:
    # app-service instances: 2 in prod (dev/test run 1). cache needs no
    # override here — the resource's own base spec (Balanced B2,
    # zone-redundant) already IS the prod value; dev/test override it down
    # instead (see dev.yaml/test.yaml).
    app-service:
      cost:
        qty: 2
