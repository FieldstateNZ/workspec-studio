name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Build precedes Test: apps/site's /c4 demo tests import the c4
      # packages' built dist through node_modules (workspace devDeps, no
      # source aliases by design) — on a clean runner that JS only exists
      # after the build stage.
      - name: Build
        run: pnpm run build

      # The C4 visual-parity suite (apps/parity) is deliberately absent here:
      # its script is named `parity` (not `test`) so `pnpm -r test` skips it,
      # because the committed goldens are *-chromium-darwin.png — minted and
      # verified on macOS, while this runner is ubuntu (font/AA rendering
      # differs per platform, so linux pixels can never match darwin goldens).
      # It is a documented LOCAL-ONLY lane: `pnpm run parity` on a Mac before
      # merging canvas/c4 chrome changes — see apps/parity/README.md. If CI
      # coverage is ever wanted, mint a linux golden set in a container and
      # add a macOS or containerized job — do not point this job at the
      # darwin goldens.
      - name: Test
        run: pnpm run test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The E2E/real-CLI smoke tests (aspire-hosting-tests/WorkspecC4E2ETests.cs,
      # WorkspecDecisionsE2ETests.cs, WorkspecCostRealCliTests.cs) need the real workspec-c4 /
      # workspec-decisions / workspec-cost CLIs (packages/c4-studio/dist/bin.js,
      # packages/decision-studio/dist/bin.js, packages/cost-studio/dist/bin.js) — without them, they
      # self-skip with a message instead of failing, so this build step is what makes them actually
      # run in CI (A6, #39 — cost-studio's build was the one still missing from this filter).
      - name: Build workspec-c4, workspec-decisions, and workspec-cost CLIs
        run: pnpm --filter @workspec/c4-studio... --filter @workspec/decision-studio... --filter @workspec/cost-studio... build

      - name: Build
        run: dotnet build --configuration Release aspire-hosting/Aspire.Hosting.Workspec.slnx

      - name: Test
        run: dotnet test --configuration Release --no-build aspire-hosting/Aspire.Hosting.Workspec.slnx
