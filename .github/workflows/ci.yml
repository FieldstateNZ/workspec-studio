name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Build precedes Test: apps/site's /c4 demo tests import the c4
      # packages' built dist through node_modules (workspace devDeps, no
      # source aliases by design) — on a clean runner that JS only exists
      # after the build stage.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The E2E smoke test (aspire-hosting-tests/WorkspecC4E2ETests.cs) needs the real
      # workspec-c4 CLI (packages/c4-studio/dist/bin.js) — without it, it self-skips with a
      # message instead of failing, so this build step is what makes it actually run in CI.
      - name: Build workspec-c4 CLI
        run: pnpm --filter @workspec/c4-studio... build

      - name: Build
        run: dotnet build --configuration Release aspire-hosting/Aspire.Hosting.Workspec.slnx

      - name: Test
        run: dotnet test --configuration Release --no-build aspire-hosting/Aspire.Hosting.Workspec.slnx
