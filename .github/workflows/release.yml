name: Release (publish to npm + NuGet)

# Publishes the @workspec/* package families (decision, c4, cost, canvas,
# topology, plus the shared schema-core/mcp-core) to npm, and the
# Workspec.Aspire.Hosting.* packages to NuGet, when a version tag is pushed (e.g.
# `v0.1.0-alpha.1`). Any package whose current version is already on its registry
# is skipped, so families can version independently and a re-run never collides.
#
# --- npm (job: publish) ---
# Trusted publishers are registered against owner FieldstateNZ / repo workspec-studio
# / workflow release.yml. Auth is via npm TRUSTED PUBLISHING (OIDC) — there is NO
# `NPM_TOKEN` secret. GitHub mints a short-lived id-token (`id-token: write` below)
# and npm exchanges it for publish rights. Provenance is NOT enabled by this workflow
# — it is turned on per package via each package.json's `publishConfig.provenance: true`,
# and is attached because the publish runs in this OIDC-authenticated CI context.
# Prerequisites:
#   1. A trusted publisher registered on npmjs.com for each package, pointing at
#      owner FieldstateNZ / repo workspec-studio / workflow release.yml.
#   2. npm CLI >= 11.5.1 (Node 20 ships npm 10, so we upgrade to a pinned 11.x below).
# Then:
#   pnpm version ...            # bump the four packages
#   git tag v0.1.0-alpha.0 && git push --tags
#
# --- NuGet (job: nuget-publish) ---
# Same tag trigger, same skip-if-already-published stance (via `dotnet nuget push
# --skip-duplicate`). Also OIDC-based — NuGet.org Trusted Publishing (GA 2025), via the
# `NuGet/login@v1` action, which exchanges the same short-lived GitHub id-token for a
# ~1-hour NuGet API key. This job is INERT BY DEFAULT (`if: vars.NUGET_PUBLISH_ENABLED
# == 'true'`) until Brett completes a ONE-TIME manual setup on nuget.org — see
# docs/decisions/RELEASING.md's "NuGet (.NET) — PENDING one-time setup" section for the
# exact steps (create a Trusted Publishing policy there, add the NUGET_USER repo
# secret, then flip the NUGET_PUBLISH_ENABLED repo variable to 'true'). Until that's
# done, this job is a no-op — pushing a tag only publishes the npm families.
#
# See docs/decisions/RELEASING.md for the full runbook (and the manual path) for both.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) + provenance, and NuGet trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; the runner's default
      # npm is older. Pin to an exact 11.x version for reproducible releases
      # (bump deliberately). Node 22 matches ci.yml — the suite is only ever
      # verified on 22.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      # Belt-and-braces gate before anything leaves the machine.
      # NOTE: the C4 visual-parity suite (apps/parity, `pnpm run parity`) is
      # deliberately NOT part of this gate or CI — its committed goldens are
      # *-chromium-darwin.png, minted on macOS, and these runners are ubuntu
      # (see apps/parity/README.md "Darwin-only goldens"). Run it locally on
      # a Mac before tagging a release that touches canvas/c4 chrome.
      - name: Verify
        run: |
          pnpm typecheck
          pnpm test

      # OIDC trusted publishing for a pnpm workspace.
      #
      # `pnpm pack` rewrites each package's `workspace:*` dependency specifiers to
      # the concrete published version *inside the tarball*. A raw `npm publish`
      # from a package directory would NOT do this and would ship uninstallable
      # manifests (npm has no `workspace:` protocol). We then `npm publish <tarball>`,
      # which performs npm's OIDC token exchange (trusted publishing) and attaches
      # provenance from the package's `publishConfig.provenance: true`.
      - name: Publish (pnpm pack → npm publish, OIDC)
        run: |
          set -euo pipefail
          # The publishable set, walked IN DEPENDENCY ORDER (a package must be
          # published after everything it depends on, so the registry is never
          # left referencing an unpublished version):
          #   - schema-core first (decision-schema + topology-schema/model dep on it);
          #   - mcp-core before every *-studio (they all dep on it since #100);
          #   - canvas before c4-ui (S5, #121 — the canvas extraction; the C4
          #     layer folded into c4-ui itself, ADR i, so canvas is the only
          #     canvas-family name);
          #   - topology-cost after decision-engine/schema; topology-studio last
          #     in its family (deps on mcp-core + every topology sibling).
          # A BRAND-NEW name cannot be created by this OIDC job — it needs the
          # one-time manual bootstrap publish + trusted-publisher registration
          # (docs/decisions/RELEASING.md "First publish of a new package")
          # BEFORE the tag push, or this loop fails on it with E404.
          packages=(
            schema-core
            mcp-core
            decision-schema decision-engine decision-ui decision-studio
            canvas
            c4-schema c4-model c4-layout c4-ui c4-studio
            cost-schema cost-provider cost-provider-azure cost-engine cost-ui cost-studio
            topology-schema topology-model topology-adapters topology-recon topology-cost topology-ui topology-studio
          )
          out="$(mktemp -d)"
          published=0
          for pkg in "${packages[@]}"; do
            version="$(node -p "require('./packages/$pkg/package.json').version")"
            name="@workspec/$pkg"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip: $name@$version already on the registry"
              continue
            fi
            # A prerelease (e.g. 0.1.0-alpha.1) must NOT publish to `latest` —
            # npm 11.x rejects it without an explicit --tag — so route it to its
            # prerelease channel (alpha/beta/rc); a stable version goes to `latest`.
            if [[ "$version" == *-* ]]; then
              pre="${version#*-}"
              dist_tag="${pre%%.*}"
            else
              dist_tag="latest"
            fi
            pnpm --filter "$name" pack --pack-destination "$out"
            tgz="$out/workspec-$pkg-$version.tgz"
            echo "publishing $name@$version to dist-tag '$dist_tag'"
            npm publish "$tgz" --access public --tag "$dist_tag"
            published=$((published + 1))
          done
          if [ "$published" -eq 0 ]; then
            echo "error: nothing to publish — every package version already on the registry" >&2
            exit 1
          fi
          echo "published $published package(s)"

  nuget-publish:
    runs-on: ubuntu-latest
    # INERT BY DEFAULT: flip the NUGET_PUBLISH_ENABLED repo variable to 'true' once the one-time
    # nuget.org Trusted Publishing policy + NUGET_USER repo secret are set up (pending — see
    # docs/decisions/RELEASING.md's "NuGet (.NET)" section). Until then, a pushed tag publishes the
    # npm families above but this job is a no-op — nothing on nuget.org is touched.
    if: vars.NUGET_PUBLISH_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore aspire-hosting/Aspire.Hosting.Workspec.slnx

      - name: Build
        run: dotnet build --configuration Release --no-restore aspire-hosting/Aspire.Hosting.Workspec.slnx

      # Belt-and-braces gate before anything leaves the machine. Weaker than ci.yml's own dotnet
      # job: this workflow doesn't install/build the workspec-c4/decisions/cost JS CLIs first, so
      # the E2E/real-CLI tests self-skip here rather than exercising the real binaries — ci.yml is
      # what actually gates those; this is a smoke check that the packed assemblies still build and
      # the CLI-independent unit tests still pass right before anything leaves the machine.
      - name: Test
        run: dotnet test --configuration Release --no-build aspire-hosting/Aspire.Hosting.Workspec.slnx

      # IsPackable=false on aspire-hosting-tests/aspire-hosting-e2e-fixture-apphost means only the
      # four shipping projects (Core/C4/Decisions/Cost) produce a .nupkg here.
      - name: Pack
        run: dotnet pack --configuration Release --no-build --output artifacts/nuget aspire-hosting/Aspire.Hosting.Workspec.slnx

      # NuGet Trusted Publishing (OIDC, GA 2025): exchanges the job's short-lived GitHub id-token
      # for a ~1-hour NuGet API key — no long-lived NUGET_API_KEY secret. `user` is the nuget.org
      # profile name the Trusted Publishing policy (see docs/decisions/RELEASING.md) was created
      # under; kept as a secret per NuGet's own recommendation even though it isn't itself sensitive.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: |
          set -euo pipefail
          shopt -s nullglob
          nupkgs=(artifacts/nuget/*.nupkg)
          if [ ${#nupkgs[@]} -eq 0 ]; then
            echo "error: no .nupkg produced — expected 4 (Core/C4/Decisions/Cost)" >&2
            exit 1
          fi
          for pkg in "${nupkgs[@]}"; do
            echo "pushing $pkg (--skip-duplicate: a no-op if this version is already on nuget.org)"
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
