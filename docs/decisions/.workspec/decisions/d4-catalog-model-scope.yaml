# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: d4-catalog-model-scope
spec:
  title: D4 — Catalog model scope for OSS v1
  status: accepted
  created: 2026-07-01
  decided: 2026-07-01
  deciders:
    - Fieldstate Dev Lead
  context: "The design prototype carried two pricing models: a simple engine model
    (pricingModes/schedules/skus) that actually feeds compute(), and a rich
    provider/resource/tier/usage/custom model that does not. OSS v1 must pick a catalog schema.
    Costs below are the ongoing monthly build + maintenance effort of carrying each model, in loaded
    engineer-days."
  decision: Use Simple engine model.
  rationale: We accept a less expressive catalog in exchange for a small, snapshot-lockable normative
    surface that a future Rust CLI and WorkSpec Enterprise can match byte-for-byte. Flat lines are
    the escape hatch for anything the simple model cannot price; the rich provider/resource model is
    deferred to Enterprise.
  consequences:
    - Ship exactly the tables the engine reads. Covers the hosting-platform golden fixture and every
      case the recommendation needs, with a tiny normative surface.
  alternatives:
    - title: Rich provider/resource model
      reason: Port the prototype's full catalog-data model. Far more expressive, but a large normative
        surface to specify, validate and hold stable across a future Rust CLI and WorkSpec
        Enterprise.
    - title: Keep both models
      reason: Ship both and let them diverge — exactly the prototype's confusing state, where only one of
        the two models actually prices anything.
