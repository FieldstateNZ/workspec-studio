# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: d1-monorepo-build-tooling
spec:
  title: D1 — Monorepo structure & build tooling
  status: accepted
  created: 2026-07-01
  decided: 2026-07-01
  deciders:
    - Fieldstate Dev Lead
  context: The four packages (schema ← engine ← ui ← studio) need a monorepo layout, a build, and a
    task runner. Costs below are the ongoing monthly carrying effort of each choice (config drift,
    upgrades, CI wiring) in loaded engineer-days; one-off setup was roughly comparable across all
    three, so it is not costed.
  decision: Use pnpm workspaces + tsup.
  rationale: We accept no cross-package build cache in exchange for the lowest config surface and zero
    SaaS dependency. The graph is four packages — pnpm + tsup builds it in seconds, and there is
    nothing extra to keep in step. Turbo/Nx earn their keep on large graphs we do not have.
  consequences:
    - pnpm workspaces for the dependency graph, tsup (esbuild) per package for ESM + .d.ts, Vitest
      at the root. No task-runner service, no remote cache.
  alternatives:
    - title: pnpm + Turborepo
      reason: Turborepo orchestrates the task graph with a remote cache. Faster CI on a large graph, at
        the cost of a turbo.json to maintain and (for real gains) a paid remote-cache tier.
    - title: Nx
      reason: Nx brings generators, an affected-graph, and plugins. Powerful for a big org monorepo, but
        heavier config and concepts than four small packages need.
