# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: d5-enterprise-mount-seam
spec:
  title: D5 — Enterprise mount seam for the UI
  status: accepted
  created: 2026-07-01
  decided: 2026-07-01
  deciders:
    - Fieldstate Dev Lead
  context: The open-core promise is that the SAME decision-ui runs standalone and inside WorkSpec
    Enterprise's shell, with no component forks — links that are inert labels standalone come alive
    against the enterprise graph. How should Enterprise mount the UI? Costs below are ongoing
    monthly integration + maintenance effort in loaded engineer-days.
  decision: Use Module federation remote.
  rationale: We accept a second build target and a shared-dependency policy in exchange for one
    component source that Enterprise mounts at runtime with no forks — the core of the open-core
    promise. npm-embed is cheaper and simpler but cannot mount at runtime; an iframe isolates too
    hard to share the host contract (links, theme, capabilities). The S6 smoke host proves a single
    React instance across the seam.
  consequences:
    - Build decision-ui a second time as an MF remote exposing DecisionWorkspace / DecisionCard /
      AdrView. Enterprise loads it at runtime; a smoke host proves a single React instance across
      the boundary.
  alternatives:
    - title: npm package, host bundles
      reason: Enterprise depends on the published @workspec/decision-ui and bundles it at build time.
        Simplest and cheapest — but the UI can only ship when Enterprise rebuilds, and there is no
        runtime seam.
    - title: Iframe embed
      reason: "Run the standalone studio and frame it inside Enterprise. Hard isolation, but a clumsy
        seam: postMessage plumbing for auth/links/theme and no shared component model."
