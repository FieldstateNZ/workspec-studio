    <script>
      // No-flash theming (see @workspec/design docs/theming.md): set BOTH
      // WorkSpec theme signals — the data-aesthetic/data-theme attribute pair
      // (activates the token palette) and the .dark class (activates
      // Tailwind's dark: variant) — synchronously, before any stylesheet or
      // app bundle loads. A stored preference wins; otherwise this follows
      // prefers-color-scheme. main.tsx's initTheme() keeps the signals in
      // sync afterward through @workspec/design's single setTheme() (Site
      // Review UX pass, finding 03/04/05) — this script is a byte-for-byte
      // copy of @workspec/design's exported NO_FLASH_SCRIPT constant (it
      // can't `import` one: this has to run synchronously before any script
      // tag, module or otherwise, so it's necessarily hand-placed here, not
      // pulled in at build time — see that constant's own doc comment).
      (function () {
        var root = document.documentElement,
          theme = 'dark';
        // Mirrors @workspec/design systemTheme(): no matchMedia → 'dark'
        // (never a light-first flash in limited/test hosts).
        function sys() {
          return typeof window.matchMedia === 'function' &&
            !window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'light'
            : 'dark';
        }
        try {
          var stored = JSON.parse(localStorage.getItem('workspec.theme'));
          theme =
            stored && (stored.theme === 'light' || stored.theme === 'dark') ? stored.theme : sys();
        } catch (e) {
          theme = sys();
        }
        root.setAttribute('data-aesthetic', 'console');
        root.setAttribute('data-theme', theme);
        root.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
