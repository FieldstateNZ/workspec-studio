# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: postgres-hosting
spec:
  title: 'Postgres: managed PaaS vs self-hosted on Kubernetes'
  status: accepted
  created: 2026-07-01
  decided: 2026-07-02
  deciders:
    - Platform Engineering
  context: The analytics warehouse and the delivery service's application database both need a
    production Postgres with a real HA story. We can buy it as a managed PaaS (Azure Database for
    PostgreSQL Flexible Server) or run it ourselves on the existing AKS cluster with the
    CloudNativePG operator. This decision costs all three shapes across dev / test / prod and weighs
    them on ops burden, resilience, performance control, lock-in and data residency.
  decision: Use Managed (HA + read replica).
  rationale:
    We accept a higher run rate and continued Azure lock-in in exchange for zone-redundant HA
    and a fully managed operational surface, so the platform team stays focused on product rather
    than database on-call. Self-hosting wins on control and portability but the loaded on-call cost
    and ops burden outweigh that for a team this size.
  consequences:
    - Zone-redundant HA standby plus a read replica for prod. Same managed surface as single-zone,
      with a real failover and read-scaling story.
  alternatives:
    - title: Managed (single-zone)
      reason:
        One managed Flexible Server per environment, single availability zone. Cheapest to run; no
        HA, so a zone outage is downtime.
    - title: Self-hosted on Kubernetes
      reason:
        'Run Postgres ourselves on the existing cluster with the CloudNativePG operator: a 3-node
        prod quorum, our storage, our backups — and our on-call. Cheapest compute, most control,
        heaviest ops.'
  references:
    - kind: system-requirement
      target: SYSREQ-44 Data residency (NZ)
      label: SYSREQ-44 Data residency (NZ)
    - kind: feature
      target: FEAT-204 Unified warehouse
      label: FEAT-204 Unified warehouse
