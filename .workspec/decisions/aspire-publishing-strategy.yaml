# yaml-language-server: $schema=https://schema.workspec.io/v1alpha1/decision.schema.json
apiVersion: workspec.io/v1alpha1
kind: Decision
metadata:
  slug: aspire-publishing-strategy
spec:
  title: "WorkSpec as an Aspire publishing layer: enrichment vs own publisher"
  status: accepted
  created: 2026-07-26
  decided: 2026-07-26
  deciders:
    - Brett (PO), via the frozen S0 decision procedure; executed by the dev lead
  context: "Topology v0.1 inserts WorkSpec into Aspire's publish chain: the apphost declares app
    resources; WorkSpec enriches the model with what Aspire does not carry (resource groups,
    vnet/subnet placement, environments, per-env SKUs) before emission. Two strategies were on the
    table — enrich the stock provider's input in flight, or own emission outright against OpenTofu.
    The choice was frozen as an empirical question: the S0 spike (issue #103) answered it against
    Aspire 13.4.6 with real `aspire publish` runs. Full findings:
    docs/topology/s0-publishing-provider-spike.md. Criteria weights follow the frozen procedure:
    interposability and concept survivability ARE the procedure's two gates, hence highest weight;
    churn exposure is weighted lowest because it is mitigable in-design (isolation seam +
    compile-time tripwire) rather than a gate. The outcome is robust to reweighting — the fallback
    only overtakes under an implausible ~10x churn weighting combined with discounting build cost to
    zero."
  decision: Use Enrichment (interpose + mutate + delegate).
  rationale: "We accept dependence on the experimental Aspire Pipelines surface (with a thin isolation
    seam and compile-time tripwires) for not owning an infrastructure emitter: S0 proved both
    decision gates — cross-package interposition works and every probed infra-shell concept survives
    the stock providers at step time — so enrichment achieves the required per-env publishing
    behaviour while the stock providers keep their own emission burden. The own-publisher path
    remains the documented fallback in #106."
  consequences:
    - "WorkSpec registers an early-window pipeline step (after validate-compute-environments,
      required by the provider's prepare-deployment-targets step), mutates the live
      DistributedApplicationModel from topology artifacts, and the stock provider (Docker Compose /
      Azure Bicep) emits. Proven end-to-end in S0: cross-package mutation landed in emitted compose
      YAML and Bicep, including SKU changes, per-resource resource-group scoping, and alien
      vnet/subnet constructs. Works identically from TS apphosts (C# package under the guest/host
      split)."
  alternatives:
    - title: Own publisher (OpenTofu-only emission)
      reason: "WorkSpec implements its own compute-environment resource mirroring
        DockerComposeEnvironmentResource, consuming the model + topology artifacts and emitting HCL
        directly; OpenTofu sole target. Well precedented pattern; retained as the documented
        fallback in #106 should the experimental surface shift underneath the enrichment step. NOTE:
        S0 ran no probes against this path — these scores are analytic estimates, unlike the
        enrichment option's evidence-backed scores."
  references:
    - kind: system-requirement
      target: Topology v0.1 decision procedure (recorded in workspec-studio#103)
      label: Topology v0.1 decision procedure (recorded in workspec-studio#103)
    - kind: feature
      target: workspec-studio#112 Epic — Topology v0.1
      label: workspec-studio#112 Epic — Topology v0.1
    - kind: feature
      target: workspec-studio#106 publisher MVP (scoped to A1 by this decision)
      label: workspec-studio#106 publisher MVP (scoped to A1 by this decision)
